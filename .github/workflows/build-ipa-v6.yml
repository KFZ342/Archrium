name: Build Archrium IPA v6

on:
  workflow_dispatch:

concurrency:
  group: archrium-ipa-v6
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download dependency prefixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45926700307 -n archrium-dependencies -D .build/dependencies
      - name: Download boot base
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45930595556 -n archrium-boot-base -D .build/starter
      - name: Build frameworks
        run: scripts/ci/build-ipa.sh runtime
      - uses: actions/upload-artifact@v4
        with:
          name: archrium-frameworks
          path: .build/kernarium-xcframeworks
          if-no-files-found: error
          retention-days: 7

  build:
    needs: runtime
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archrium-frameworks
          path: .build/kernarium-xcframeworks
      - name: Download bundled Linux image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/rootfs-parts
          gh release download rootfs-v1 -R "$GITHUB_REPOSITORY" -p 'archrium.erofs.part.*' -D .build/rootfs-parts
          cat .build/rootfs-parts/archrium.erofs.part.* > .build/archrium.erofs
          LS=\$(wc -c < .build/archrium.erofs | tr -d ' ')
          echo "bundled rootfs bytes: \$LS"
      - name: Build app and IPA
        env:
          ARCHRIUM_ROOTFS: .build/archrium.erofs
        run: scripts/ci/build-ipa.sh app
      - uses: actions/upload-artifact@v4
        with:
          name: Archrium-unsigned-ipa
          path: Archrium-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
